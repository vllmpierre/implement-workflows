name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build directory
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build/
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Download build directory
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: build/

      - name: Fix executable permissions
        run: chmod +x build/cpu_monitor_app build/tests/test_cpu_monitor

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang-tidy

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Configure (for compile_commands.json)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          set -o pipefail
          clang-tidy src/*.c -p build | tee clang-tidy-output.txt

      - name: Post clang-tidy findings as PR review comments
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: reviewdog -f=clang-tidy -name="clang-tidy" -reporter=github-pr-review -fail-level=warning < clang-tidy-output.txt

      - name: Fail on clang-tidy findings (non-PR runs)
        if: github.event_name != 'pull_request'
        run: |
          if grep -qE ': (warning|error): ' clang-tidy-output.txt; then
            echo "clang-tidy reported findings" >&2
            exit 1
          fi
